---
apiVersion: v1
kind: Namespace 
metadata:
  name: myns3
  labels:
    app: web
    dept: eng




---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dov-deploy
  labels:
    app: dov
  namespace: myns3
spec:
  replicas:
  selector:
    matchLabels:
      app: dov-bear
  template:    
    metadata:
       name: dov-bear
       labels:
         app: dov-bear
       namespace: myns3
    spec:
       containers:
       - name: dov-bear-container
         image: chukmunnlee/dov-bear:v1
         imagePullPolicy: IfNotPresent
         env: 
         - name: PORT
           value: '5000'
         - name: INSTANCE_NAME
           valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
         ports:
          - containerPort: 5000      
          
---
apiVersion: v1
kind: Service
metadata:
  name: dov-svc
  namespace: myns3
  labels:
    app: dov
spec:
  type: LoadBalancer
  selector:
    app: dov-bear   
  ports:
  - port: 8081
    targetPort: 5000