---
apiVersion: v1
kind: Namespace 
metadata:
  name: cadang-ns
  labels:
    app: web
    dept: eng


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadang-deploy
  labels:
    app: caddyapp
  namespace: cadang-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: caddyapp
  template:    
    metadata:
       name: caddyapp
       labels:
         app: caddyapp
       namespace: cadang-ns
    spec:
       containers:
       - name: caddyapp
         image: bobbylangxuan/jfcaddy:v1
         imagePullPolicy: IfNotPresent
         ports:
          - containerPort: 8080      

---
apiVersion: v1
kind: Service
metadata:
  name: cadang-svc
  namespace: cadang-ns
  labels:
    app: dov
spec:
  type: ClusterIP
  selector:
    app: dov-bear
    dept: eng    
  ports:
  - port: 80
    targetPort: 8080